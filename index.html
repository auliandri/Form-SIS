<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peminjaman Alat SIS</title>
<style>
:root{--bg:#f4f6f3;--card:#fff;--ink:#12302f;--muted:#5d706e;--line:#cfd9d6;--accent:#0f6b63;--accent-ink:#fff;--warn:#b4401f}
@media (prefers-color-scheme:dark){:root{--bg:#0d1a19;--card:#152826;--ink:#e6efed;--muted:#93a9a6;--line:#2b4441;--accent:#3cb4a6;--accent-ink:#06201d;--warn:#ff9a76}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif;padding:16px}
main{max-width:480px;margin:0 auto}
h1{font-size:1.4rem;margin:8px 0 2px}
.sub{color:var(--muted);margin:0 0 16px}
.tabs{display:flex;gap:6px;background:var(--line);padding:4px;border-radius:12px;margin-bottom:16px}
.tabs button{flex:1;border:0;background:transparent;color:var(--ink);padding:10px;border-radius:9px;font:inherit;font-weight:600;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
label.f{display:block;font-weight:600;margin:12px 0 4px}
input[type=text],input[type=tel],input[type=email],textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--bg);color:var(--ink)}
textarea{min-height:76px;resize:vertical}
fieldset{border:0;padding:0;margin:16px 0 0}
legend{font-weight:600;margin-bottom:6px;padding:0}
.chk{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.send{width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.err{color:var(--warn);font-size:.9rem;margin-top:10px;min-height:1.2em}
.note{color:var(--muted);font-size:.85rem;margin-top:12px}
[hidden]{display:none}
</style>
</head>
<body>
<main>
  <h1>Peminjaman Alat SIS</h1>
  <p class="sub">Sistem interpretasi simultan (penerjemah)</p>

  <div class="tabs" role="tablist">
    <button role="tab" id="tab-ambil" aria-selected="true">Ambil alat</button>
    <button role="tab" id="tab-kembali" aria-selected="false">Kembalikan alat</button>
  </div>

  <div class="card">
    <div id="banner" class="note" hidden style="margin:0 0 8px"></div>
    <label class="f" for="nama">Nama</label>
    <input type="text" id="nama" autocomplete="name">
    <label class="f" for="hp">No. handphone</label>
    <input type="tel" id="hp" autocomplete="tel" inputmode="tel">
    <label class="f" for="email">Email</label>
    <input type="email" id="email" autocomplete="email">
    <label class="f" for="instansi">Instansi</label>
    <input type="text" id="instansi" autocomplete="organization">

    <fieldset>
      <legend id="chk-title">Ceklis saat pengambilan</legend>
      <div id="items"></div>
    </fieldset>

    <div id="ket-wrap" hidden>
      <label class="f" for="ket">Keterangan pengembalian</label>
      <textarea id="ket" placeholder="Contoh: semua lengkap, kondisi baik"></textarea>
    </div>

    <div class="err" id="err" role="alert"></div>
    <button class="send" id="send">Kirim ke WhatsApp</button>
    <p class="note">Tombol ini membuka WhatsApp dengan pesan yang sudah terisi. Tekan kirim di WhatsApp untuk menyelesaikan.</p>
  </div>
</main>

<script>
// ====== PENGATURAN ======
var WA_NUMBER = "6281212752501"; // 081212752501 dalam format internasional
var ITEMS = [
  "Transmitter",
  "Receiver",
  "Earphone",
];
// ========================

var mode = "ambil";
var KEY = "sis-peminjam";
var $ = function (id) { return document.getElementById(id); };

function store(get, val) {
  try { return get ? JSON.parse(localStorage.getItem(KEY) || "null") : (val ? localStorage.setItem(KEY, JSON.stringify(val)) : localStorage.removeItem(KEY)); }
  catch (e) { return null; }
}

function renderItems() {
  $("items").innerHTML = ITEMS.map(function (t, i) {
    return '<label class="chk"><input type="checkbox" data-i="' + i + '"><span>' + t + '</span></label>';
  }).join("");
}

function setMode(m) {
  mode = m;
  $("tab-ambil").setAttribute("aria-selected", m === "ambil");
  $("tab-kembali").setAttribute("aria-selected", m === "kembali");
  $("chk-title").textContent = m === "ambil" ? "Ceklis saat pengambilan (alat yang diterima)" : "Ceklis saat pengembalian (alat yang dikembalikan)";
  $("ket-wrap").hidden = m === "ambil";
  $("send").textContent = m === "ambil" ? "Kirim data pengambilan" : "Kirim pengembalian";
  $("err").textContent = "";
  renderItems();
  var saved = store(true);
  $("banner").hidden = true;
  if (m === "kembali" && saved) {
    $("nama").value = saved.nama; $("hp").value = saved.hp;
    $("email").value = saved.email; $("instansi").value = saved.instansi;
    $("banner").hidden = false;
    $("banner").textContent = "Data pengambilan Anda sudah terisi. Cek ceklis lalu kirim.";
  }
}

function waktu() {
  return new Date().toLocaleString("id-ID", { dateStyle: "long", timeStyle: "short" });
}

$("tab-ambil").onclick = function () { setMode("ambil"); };
$("tab-kembali").onclick = function () { setMode("kembali"); };

$("send").onclick = function () {
  var d = {
    nama: $("nama").value.trim(), hp: $("hp").value.trim(),
    email: $("email").value.trim(), instansi: $("instansi").value.trim()
  };
  if (!d.nama || !d.hp || !d.email || !d.instansi) { $("err").textContent = "Lengkapi nama, no. handphone, email, dan instansi."; return; }
  if (!/^\S+@\S+\.\S+$/.test(d.email)) { $("err").textContent = "Format email belum benar."; return; }

  var boxes = document.querySelectorAll("#items input");
  var lines = ITEMS.map(function (t, i) { return (boxes[i].checked ? "[x] " : "[ ] ") + t; }).join("\n");
  var head = mode === "ambil" ? "*PENGAMBILAN ALAT SIS*" : "*PENGEMBALIAN ALAT SIS*";
  var msg = head + "\n" + waktu() +
    "\n\nNama: " + d.nama + "\nNo. HP: " + d.hp + "\nEmail: " + d.email + "\nInstansi: " + d.instansi +
    "\n\nCeklis " + (mode === "ambil" ? "pengambilan" : "pengembalian") + ":\n" + lines;
  if (mode === "kembali") msg += "\n\nKeterangan: " + ($("ket").value.trim() || "Alat sudah dikembalikan.");

  if (mode === "ambil") store(false, d); else store(false, null);
  window.location.href = "https://wa.me/" + WA_NUMBER + "?text=" + encodeURIComponent(msg);
};

setMode(store(true) ? "kembali" : "ambil");
</script>
</body>
</html>
