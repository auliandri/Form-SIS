<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Peminjaman Alat SIS</title>
<style>
:root{--bg:#f4f6f3;--card:#fff;--ink:#12302f;--muted:#5d706e;--line:#cfd9d6;--accent:#0f6b63;--accent-ink:#fff;--warn:#b4401f}
@media (prefers-color-scheme:dark){:root{--bg:#0d1a19;--card:#152826;--ink:#e6efed;--muted:#93a9a6;--line:#2b4441;--accent:#3cb4a6;--accent-ink:#06201d;--warn:#ff9a76}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif;padding:16px}
main{max-width:960px;margin:0 auto}
h1{font-size:1.3rem;margin:8px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
input{padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--bg);color:var(--ink);width:100%}
button{padding:11px 16px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;cursor:pointer}
.row{display:flex;gap:8px}
.err{color:var(--warn);margin:8px 0 0}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:.8rem;font-weight:600;border:1px solid var(--accent);color:var(--accent)}
.tag.k{border-color:var(--muted);color:var(--muted)}
.muted{color:var(--muted)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none}
</style>
</head>
<body>
<main>
  <h1>Data Peminjaman Alat SIS</h1>

  <div class="card" id="login">
    <div class="row">
      <input type="password" id="pin" placeholder="PIN" autocomplete="current-password">
      <button id="go">Buka</button>
    </div>
    <div class="err" id="err" role="alert"></div>
  </div>

  <div id="app" hidden>
    <div class="card" id="sum"></div>
    <div class="card row">
      <input type="search" id="q" placeholder="Cari nama, instansi, tanggal...">
      <button id="reload">Muat ulang</button>
    </div>
    <div class="card wrap">
      <table>
        <thead><tr><th>Nama</th><th>No. HP</th><th>Instansi</th><th>Pengambilan</th><th>Pengembalian</th><th>Alat</th><th>Keterangan</th></tr></thead>
        <tbody id="body"></tbody>
      </table>
      <p class="muted" id="empty" hidden>Belum ada data.</p>
    </div>
  </div>
</main>

<script>
var SHEET_URL = ""; // tempel URL Web App Google Apps Script (sama seperti di index.html)
var rows = [], pin = "";
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

function load() {
  $("err").textContent = "";
  if (!SHEET_URL) { $("err").textContent = "SHEET_URL belum diisi di data.html."; return; }
  $("go").disabled = true;
  fetch(SHEET_URL + "?pin=" + encodeURIComponent(pin))
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (j.error) { $("err").textContent = j.error; return; }
      rows = j.rows; $("login").hidden = true; $("app").hidden = false; render();
    })
    .catch(function () { $("err").textContent = "Gagal memuat data. Cek URL dan koneksi."; })
    .then(function () { $("go").disabled = false; });
}

// o = indeks awal kolom: 4 = pengambilan, 9 = pengembalian
function cell(r, o) {
  return r[o] ? "\u2713 " + esc(r[o + 1]) + ", " + esc(r[o + 2]) + " " + esc(String(r[o + 3]).slice(0, 5)) : '<span class="muted">Belum</span>';
}

function render() {
  var out = rows.filter(function (r) { return r[4] && !r[9]; });
  $("sum").innerHTML = "<strong>Sedang dipinjam: " + out.length + "</strong>" +
    (out.length ? '<div class="muted">' + out.map(function (r) { return esc(r[0]) + " (" + esc(r[3]) + ")"; }).join(", ") + "</div>" : "");

  var q = $("q").value.toLowerCase();
  var list = rows.slice().reverse().filter(function (r) { return !q || r.join(" ").toLowerCase().indexOf(q) > -1; });
  $("body").innerHTML = list.map(function (r) {
    var alat = (r[8] ? "Ambil: " + esc(r[8]) : "") + (r[13] ? "<br>Kembali: " + esc(r[13]) : "");
    return "<tr><td>" + esc(r[0]) + "</td><td>" + esc(r[1]) + "</td><td>" + esc(r[3]) + "</td><td>" + cell(r, 4) + "</td><td>" + cell(r, 9) + "</td><td>" + alat + "</td><td>" + esc(r[14]) + "</td></tr>";
  }).join("");
  $("empty").hidden = list.length > 0;
}

$("go").onclick = function () { pin = $("pin").value; load(); };
$("pin").onkeydown = function (e) { if (e.key === "Enter") $("go").onclick(); };
$("q").oninput = render;
$("reload").onclick = load;
</script>
</body>
</html>
